[package]
name = "cqlz-gym"
description = "Designs Cassandra tables for a query workload: ILP and a small learned policy search, every candidate verified by cqlc-core, validated on a real ScyllaDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["cql", "cassandra", "rl", "schema", "hpc"]
categories = ["database", "science", "development-tools"]
readme = "README.md"

[features]
# GPU training through burn's wgpu backend.
wgpu = ["burn/wgpu"]

[dependencies]
cqlc-core = { workspace = true }
burn = { version = "0.22", default-features = false, features = ["std", "flex", "autodiff", "optim", "store", "safetensors"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
toml = "0.9"
ureq = "3"
scylla = "1.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
uuid = "1"
async-trait = "0.1"
good_lp = { version = "1", default-features = false, features = ["microlp"] }
